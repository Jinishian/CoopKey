<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoopKey">
<title>CoopKey — Egg to Coop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --shell:#16110D; --panel:#1F1812; --panel2:#271E16; --line:#382C20;
  --cream:#F3ECDD; --muted:#A99A84; --faint:#6E6253;
  --yolk:#F0A93B; --yolk-soft:#FFC566;
  --alive:#84B26A; --clear:#8A7E6E; --quit:#CC6F57; --info:#7BA7C4; --lost:#B98BD1;
  --display:'Fraunces',Georgia,serif;
  --ui:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:13px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ui); background:var(--shell); color:var(--cream);
  -webkit-font-smoothing:antialiased; line-height:1.45;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::selection{background:rgba(240,169,59,.3)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.glow{box-shadow:0 0 26px -6px rgba(240,169,59,.6)}

/* ---------- AUTH ---------- */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 50% -10%, #2a1d10 0%, var(--shell) 55%);}
.auth-card{width:100%;max-width:400px}
.brandmark{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:8px}
.egg-logo{width:34px;height:42px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 38%, var(--yolk-soft), var(--yolk) 55%, #b6791f 100%);
  box-shadow:0 0 30px -4px rgba(240,169,59,.7), inset 0 -6px 12px rgba(0,0,0,.25);}
.wordmark{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:-.02em}
.wordmark b{color:var(--yolk);font-weight:600}
.auth-tag{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}
.ver-badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:2px 8px;display:inline-block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.auth-panel{padding:26px 24px}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:var(--r-sm);margin-bottom:22px}
.tabs button{flex:1;padding:9px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--yolk);color:#2a1c08}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;background:var(--shell);border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--cream);transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--yolk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;
  border-radius:var(--r-sm);font-weight:600;font-size:14px;transition:transform .08s,filter .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--yolk);color:#2a1c08;width:100%}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--panel2);color:var(--cream);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--faint)}
.auth-err{color:var(--quit);font-size:13px;margin-top:4px;min-height:18px}
.auth-foot{text-align:center;color:var(--faint);font-size:12px;margin-top:18px;line-height:1.6}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100%}
.shell{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.side .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 20px}
.side .egg-logo{width:22px;height:28px}
.side .wordmark{font-size:18px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);
  color:var(--muted);font-size:14px;font-weight:500;text-align:left;width:100%;transition:background .12s,color .12s}
.nav button:hover{background:var(--panel2);color:var(--cream)}
.nav button.on{background:var(--panel2);color:var(--cream)}
.nav button.on .ic{color:var(--yolk)}
.ic{width:19px;height:19px;flex-shrink:0;display:flex;color:var(--faint)}
.nav button.on .ic,.nav button:hover .ic{color:var(--yolk)}
.side .acct{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.acct-row{display:flex;align-items:center;gap:10px;padding:6px 8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--yolk);color:#2a1c08;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.acct-row .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-row .pl{font-size:11px;color:var(--faint)}

.main{overflow-y:auto;height:100%;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.main::-webkit-scrollbar{width:9px}
.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 30px 90px}
.head{margin-bottom:24px}
.head h1{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.01em;line-height:1.1}
.head p{color:var(--muted);font-size:14px;margin-top:4px}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

/* cards / grid */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad-lg{padding:22px}
.stat .eyebrow{margin-bottom:10px}
.stat .num{font-family:var(--display);font-size:38px;font-weight:500;line-height:1;letter-spacing:-.02em}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:7px}
.stat .num.amber{color:var(--yolk)}
.section-title{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:30px 0 13px}

/* list rows */
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:600;font-size:14.5px}
.row .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
  padding:3px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.alive{color:var(--alive);border-color:rgba(132,178,106,.3)}
.tag.amber{color:var(--yolk);border-color:rgba(240,169,59,.3)}
.tag.quit{color:var(--quit);border-color:rgba(204,111,87,.3)}
.tag.info{color:var(--info);border-color:rgba(123,167,196,.3)}
.tag.lost{color:var(--lost);border-color:rgba(185,139,209,.3)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* progress */
.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yolk),var(--yolk-soft));border-radius:6px}

/* egg tray (candling signature) */
.tray{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.egg{width:38px;height:48px;border-radius:50% 50% 50% 50%/60% 60% 42% 42%;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--faint);transition:transform .12s,box-shadow .2s;position:relative}
.egg:hover{transform:translateY(-2px)}
.egg.fertile{background:radial-gradient(circle at 50% 40%,var(--yolk-soft),var(--yolk) 60%,#a86f1c);
  color:#2a1c08;border-color:transparent;box-shadow:0 0 22px -4px rgba(240,169,59,.75)}
.egg.clear{background:var(--panel2);color:var(--clear);opacity:.7}
.egg.quitter{background:rgba(204,111,87,.16);border-color:rgba(204,111,87,.4);color:var(--quit)}
.egg.hatched{background:rgba(132,178,106,.18);border-color:rgba(132,178,106,.45);color:var(--alive)}
.egg .lbl{position:absolute;bottom:-17px;font-size:9px;color:var(--faint);white-space:nowrap}

/* mini chart */
.donut{display:flex;align-items:center;gap:18px}
.legend{display:flex;flex-direction:column;gap:9px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .sw{width:11px;height:11px;border-radius:3px}

/* empty */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ee{width:46px;height:54px;margin:0 auto 16px;border-radius:50% 50% 50% 50%/60% 60% 42% 42%;
  background:var(--panel2);border:1px dashed var(--line)}
.empty h3{font-family:var(--display);font-weight:500;font-size:19px;color:var(--cream);margin-bottom:6px}
.empty p{font-size:13.5px;max-width:320px;margin:0 auto 18px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,5,2,.72);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-bg.on{display:flex}
.modal{width:100%;max-width:460px;max-height:90vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:24px}
.modal h2{font-family:var(--display);font-weight:500;font-size:22px;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:20px}
.field textarea,.field select{width:100%;padding:11px 13px;background:var(--shell);border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--cream);resize:vertical}
.field select:focus,.field textarea:focus{outline:none;border-color:var(--yolk)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions .btn{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:7px;background:var(--shell);border:1px solid var(--line);
  font-size:13px;color:var(--muted)}
.seg button.on{border-color:var(--yolk);color:var(--yolk);background:rgba(240,169,59,.08)}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 18px;
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .dot{display:inline-block;margin-right:8px;color:var(--alive)}

.linkbtn{color:var(--yolk);font-weight:600;font-size:13px}
.fab-actions{display:flex;gap:10px}

/* mobile */
.botnav{display:none}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .wrap{padding:20px 16px 96px}
  .head h1{font-size:25px}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .head-row{align-items:flex-start}
  .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}
  .botnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px;color:var(--faint);font-size:10px;font-weight:600}
  .botnav button.on{color:var(--yolk)}
  .botnav .ic{width:21px;height:21px}
  .botnav button.on .ic{color:var(--yolk)}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .mtop .brand{display:flex;align-items:center;gap:8px}
  .mtop .wordmark{font-size:17px}.mtop .egg-logo{width:19px;height:24px}
}
@media(min-width:821px){.mtop{display:none}}

/* ---- v0.4: journal + invoicing ---- */
.modal.wide{max-width:660px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:2px 7px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.photo-grid.sm{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(15,10,6,.82);color:var(--cream);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line)}
.photo-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:10px;font-family:var(--mono)}
.add-photo{aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint);font-size:11px;font-family:var(--mono);cursor:pointer;background:var(--shell)}
.add-photo:hover{border-color:var(--yolk);color:var(--yolk)}
.jcard{display:block;cursor:pointer}
.jcard .jtext{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:8px;white-space:pre-wrap}
.itable{width:100%;border-collapse:collapse;min-width:380px}
.itable th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 6px;border-bottom:1px solid var(--line)}
.itable td{padding:6px 6px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.itable td input{width:100%;padding:8px 9px;background:var(--shell);border:1px solid var(--line);border-radius:7px;color:var(--cream);font-size:13px}
.itable td.num input{text-align:right}
.itable .tdel{color:var(--quit);cursor:pointer;text-align:center;font-size:16px;user-select:none}
.itotals{margin-top:14px;margin-left:auto;max-width:260px}
.itotals .tr{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--muted)}
.itotals .tr.grand{border-top:1px solid var(--line);margin-top:5px;padding-top:10px;color:var(--cream);font-family:var(--display);font-size:21px}
#printRoot{display:none}
@media print{
  body * {visibility:hidden}
  #printRoot,#printRoot *{visibility:visible}
  #printRoot{display:block;position:absolute;left:0;top:0;width:100%;background:#fff}
  .modal-bg,.botnav,.mtop{display:none!important}
}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--cream);cursor:pointer;margin-top:4px}
.chk input{width:16px;height:16px;accent-color:var(--yolk);cursor:pointer}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.theme-opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2);text-align:left;transition:border-color .15s}
.theme-opt:hover{border-color:var(--muted)}
.theme-opt.on{border-color:var(--yolk);box-shadow:0 0 0 1px var(--yolk) inset}
.theme-opt span:last-child{font-size:13px;font-weight:600}
.theme-sw{display:inline-flex;flex:0 0 auto;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.theme-sw i{width:15px;height:24px;display:block}
.num.alive{color:var(--alive)}
.num.quit{color:var(--quit)}
.legend{display:flex;gap:16px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.catrow{margin-bottom:13px}
.catrow:last-child{margin-bottom:0}
.catrow-top{display:flex;justify-content:space-between;font-size:13px;color:var(--cream);margin-bottom:5px}
.catbar{height:7px;border-radius:4px;background:var(--shell);overflow:hidden}
.catbar i{display:block;height:100%;background:var(--yolk);border-radius:4px}

/* ---- v0.10: flock search + card grid, trade invoicing ---- */
.flock-search{position:relative;margin-bottom:14px}
.flock-search input{width:100%;padding:11px 14px 11px 38px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--cream);font-size:14px}
.flock-search input:focus{outline:none;border-color:var(--yolk)}
.flock-search input::placeholder{color:var(--faint)}
.flock-search .sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;color:var(--faint);pointer-events:none}
.flock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.fcard:hover{border-color:var(--muted)}
.fcard-top{display:flex;align-items:flex-start;gap:12px}
.fcard-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fcard-ic .ic{width:21px}
.fcard-ic.alive{background:rgba(132,178,106,.14);color:var(--alive)}
.fcard-ic.info{background:rgba(123,167,196,.14);color:var(--info)}
.fcard-ic.lost{background:rgba(185,139,209,.14);color:var(--lost)}
.fcard-ic.quit{background:rgba(204,111,87,.14);color:var(--quit)}
.fcard-body{flex:1;min-width:0}
.fcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth">
  <div class="auth-card">
    <div class="brandmark"><div class="egg-logo"></div><div class="wordmark">Coop<b>Key</b></div></div>
    <p class="auth-tag">Your whole flock — from egg to coop.</p>
    <div style="text-align:center;margin-bottom:26px"><span class="ver-badge ver"></span></div>
    <div class="panel auth-panel">
      <div class="tabs">
        <button id="tabSignin" class="on" onclick="authTab('signin')">Sign in</button>
        <button id="tabSignup" onclick="authTab('signup')">Create account</button>
      </div>
      <div id="suName" class="field" style="display:none">
        <label>Your name</label><input id="iName" placeholder="Jane Keeper" autocomplete="name">
      </div>
      <div class="field"><label>Email</label><input id="iEmail" type="email" placeholder="you@homestead.com" autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="iPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="auth-err" id="authErr"></div>
      <button class="btn btn-primary" id="authGo" onclick="authSubmit()">Sign in</button>
      <p class="auth-foot">Demo build — accounts are stored locally on this device.<br>Production wires to managed auth + cloud sync.</p>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="egg-logo"></div><div class="wordmark">Coop<b>Key</b></div><span class="ver-badge ver" style="margin-left:auto"></span></div>
      <nav class="nav" id="navDesk"></nav>
      <div class="acct">
        <div id="syncHolder"></div>
        <div class="acct-row">
          <div class="avatar" id="avD">?</div>
          <div class="grow"><div class="nm" id="nmD">—</div><div class="pl" id="plD">Free plan</div></div>
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="mtop">
        <div class="brand"><div class="egg-logo"></div><div class="wordmark">Coop<b>Key</b></div></div>

      ['birds','batches','eggs','candlingRecords','journal','clients','invoices','expenses','shipments','biz'].forEach(c=>Store.save(c,data[c]||[]));
      const sys=Store.all('breeds').filter(b=>b.system);
      Store.save('breeds',[...sys,...(data.breeds||[])]);
      localStorage.setItem(Store.k('updated'),String(updated));
      SYNCING=false;
      if(typeof CUR!=='undefined' && document.getElementById('app').style.display==='block') go(CUR);
    } else if(!data){ await syncUp(); }
    setSync('synced');
  }catch(e){ setSync('offline'); }
}

/* ---------- HELPERS ---------- */
function breedName(id){ const b=Store.get('breeds',id); return b?b.name:'Unknown breed'; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=`<span class="dot">●</span>${msg}`; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* flock helpers — a record is either one bird or a group with a head count */
function birdQty(b){ return Math.max(1, parseInt(b.qty,10)||1); }
function sumBirds(arr){ return arr.reduce((s,b)=>s+birdQty(b),0); }

/* batch helpers — candling feeds hatch rate, hatching feeds flock */
function batchEggs(bid){ return Store.all('eggs').filter(e=>e.batchId===bid); }
function batchStats(b){
  const eggs=batchEggs(b.id);
  const set=eggs.length;
  const fertile=eggs.filter(e=>e.status==='fertile'||e.status==='hatched').length;
  const clear=eggs.filter(e=>e.status==='clear').length;
  const quit=eggs.filter(e=>e.status==='quitter').length;
  const hatched=eggs.filter(e=>e.status==='hatched').length;
  const checked=eggs.filter(e=>e.status!=='unknown').length;
  const fertRate=checked?Math.round(fertile/checked*100):0;
  const hatchRate=fertile?Math.round(hatched/fertile*100):0;
  const dleft=daysBetween(Date.now(),b.hatchDate);
  return {set,fertile,clear,quit,hatched,checked,fertRate,hatchRate,dleft};
}

/* ---------- DASHBOARD (cross-module) ---------- */
function vDash(){
  const birds=Store.all('birds').filter(b=>b.status==='active');
  const batches=Store.all('batches');
  const incubating=batches.filter(b=>b.status==='incubating');
  const eggsIn=incubating.reduce((s,b)=>s+batchEggs(b.id).length,0);
  // lifetime hatch rate
  const done=batches.filter(b=>b.status==='hatched');
  let tf=0,th=0; done.forEach(b=>{const s=batchStats(b);tf+=s.fertile;th+=s.hatched;});
  const lifeHatch = tf?Math.round(th/tf*100):0;
  // upcoming hatches
  const upcoming = incubating.map(b=>({b,d:daysBetween(Date.now(),b.hatchDate)})).sort((a,z)=>a.d-z.d);

  let html=`<div class="head"><div class="eyebrow">Welcome back</div>
    <h1>${esc(ME.name.split(' ')[0])}'s homestead</h1>
    <p>Everything from this season's eggs to the birds in your coop, in one place.</p></div>`;

  html+=`<div class="grid g4">
    ${stat('Active birds',sumBirds(birds),'in your flock')}
    ${stat('Incubating',incubating.length, incubating.length===1?'batch running':'batches running','amber')}
    ${stat('Eggs in trays',eggsIn,'being tracked')}
    ${stat('Hatch rate',lifeHatch+'%','lifetime, of fertile')}
  </div>`;

  // upcoming hatches
  html+=`<div class="section-title">Upcoming hatches</div>`;
  if(upcoming.length){
    html+=`<div class="list">`+upcoming.map(({b,d})=>{
      const s=batchStats(b);
      const tag = d<0?`<span class="tag quit">overdue</span>`: d===0?`<span class="tag amber"><span class="dot"></span>hatch day</span>`:`<span class="tag amber">${d}d left</span>`;
      return `<div class="row" onclick="openBatch('${b.id}')" style="cursor:pointer">
        <div class="grow"><div class="ttl">${esc(b.name)}</div>
        <div class="meta">${esc(b.species)} · ${s.set} eggs · ${s.fertile} fertile · due ${fmtDate(b.hatchDate)}</div></div>
        ${tag}</div>`;
    }).join('')+`</div>`;
  } else {
    html+=card(`<div class="empty" style="padding:30px"><p>No active incubation. Start a batch in the Hatchery to see your countdown here.</p>
      <button class="btn btn-ghost" style="display:inline-flex;width:auto" onclick="go('hatch')">Go to Hatchery</button></div>`);
  }

  // flock composition donut
  const comp={};
  birds.forEach(b=>{const n=breedName(b.breedId); comp[n]=(comp[n]||0)+birdQty(b);});
  html+=`<div class="section-title">Flock at a glance</div>`;
  if(birds.length){
    html+=card(donutChart(comp));
  } else {
    html+=card(`<div class="empty" style="padding:30px"><p>Your coop is empty. Add birds in the Flock tab — or hatch a batch and roll the chicks straight in.</p>
      <button class="btn btn-ghost" style="display:inline-flex;width:auto" onclick="go('flock')">Add birds</button></div>`);
  }
  document.getElementById('view').innerHTML=html;
}
function stat(label,num,sub,cls=''){
  return `<div class="card stat"><div class="eyebrow">${label}</div>
    <div class="num ${cls}">${num}</div><div class="sub">${sub}</div></div>`;
}
function card(inner,cls=''){ return `<div class="card ${cls}">${inner}</div>`; }

function donutChart(comp){
  const entries=Object.entries(comp).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,e)=>s+e[1],0);
  const palette=['#F0A93B','#84B26A','#7BA7C4','#CC6F57','#C9A24B','#9D8FB0','#E0C36B'];
  let acc=0; const segs=entries.map((e,i)=>{
    const frac=e[1]/total, start=acc*360, end=(acc+frac)*360; acc+=frac;
    return `${palette[i%palette.length]} ${start}deg ${end}deg`;
  }).join(',');
  const legend=entries.map((e,i)=>`<div><span class="sw" style="background:${palette[i%palette.length]}"></span>
    <span style="flex:1">${esc(e[0])}</span><span class="mono" style="color:var(--muted)">${e[1]}</span></div>`).join('');
  return `<div class="donut">
    <div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(${segs});
      display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div class="mono" style="font-size:20px;font-weight:600">${total}</div>
        <div style="font-size:10px;color:var(--faint)">birds</div></div></div>
    <div class="legend" style="flex:1">${legend}</div></div>`;
}

/* log a batch that already hatched — backfill a finished cycle and roll the
   chicks into the flock. Eggs set / fertile (optional) / hatched drive the stats. */
function openPastHatch(){
  const breeds=Store.all('breeds');
  if(!breeds.length){ toast('Add a breed first'); return; }
  const today=new Date().toISOString().slice(0,10);
  const body=`<h2>Log a past hatch</h2><p class="msub">Already hatched? Record the finished batch and roll the chicks straight into your flock.</p>
    <div class="field"><label>Batch name</label><input id="phName" placeholder="e.g. Coturnix — June"></div>
    <div class="field"><label>Primary breed</label><select id="phBreed">${breeds.map(x=>`<option value="${x.id}" data-sp="${esc(x.species)}" data-inc="${x.inc}">${esc(x.name)} (${x.inc}d)</option>`).join('')}</select></div>

      <div class="field"><label>Eggs set</label><input id="phSet" type="number" min="1" max="500" value="12"></div>
      <div class="field"><label>Fertile <span style="color:var(--faint)">(opt.)</span></label><input id="phFert" type="number" min="0" max="500" placeholder="—"></div>
      <div class="field"><label>Hatched</label><input id="phHatch" type="number" min="0" max="500" value="0"></div>
    </div>
    <div class="field"><label>Hatch date</label><input id="phDate" type="date" value="${today}"></div>
    <label class="chk"><input type="checkbox" id="phToFlock" checked onchange="phPrefixWrap.style.display=this.checked?'':'none'"> Add hatched chicks to my flock</label>
    <div class="field" id="phPrefixWrap" style="margin-top:12px"><label>Chick name prefix</label><input id="phPrefix" placeholder="e.g. Coturnix chick"></div>`;
  modalRaw(body,`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="phSave">Log hatch</button>`);
  const setPrefix=()=>{ const opt=phBreed.selectedOptions[0]; if(phPrefix && !phPrefix.dataset.touched){ phPrefix.value=(opt?opt.text.replace(/\s*\([^)]*\)\s*$/,''):'Chick')+' chick'; } };
  phBreed.onchange=setPrefix; setPrefix();
  phPrefix.oninput=()=>phPrefix.dataset.touched='1';
  document.getElementById('phSave').onclick=savePastHatch;
}
function savePastHatch(){
  const name=phName.value.trim(); if(!name){ toast('Name the batch'); return; }
  const opt=phBreed.selectedOptions[0];
  const inc=+opt.dataset.inc||21, sp=opt.dataset.sp, breedId=phBreed.value;
  const set=Math.max(1,Math.min(500,+phSet.value||1));
  const hatched=Math.max(0,Math.min(set,+phHatch.value||0));
  let fert=phFert.value===''?null:Math.max(0,Math.min(set,+phFert.value||0));
  if(fert!==null && fert<hatched) fert=hatched; // fertile can't be below hatched
  const hatchDate=phDate.value?new Date(phDate.value).getTime():Date.now();
  const setDate=hatchDate-inc*86400000;
  SYNCING=true;
  const batch=Store.add('batches',{name,breedId,species:sp,setDate,hatchDate,status:'hatched'});
  let label=0;
  for(let i=0;i<hatched;i++){ label++; Store.add('eggs',{batchId:batch.id,label:String(label),status:'hatched',breedId}); }
  if(fert!==null){
    for(let i=0;i<fert-hatched;i++){ label++; Store.add('eggs',{batchId:batch.id,label:String(label),status:'fertile',breedId}); }
    for(let i=0;i<set-fert;i++){ label++; Store.add('eggs',{batchId:batch.id,label:String(label),status:'clear',breedId}); }
  } else {
    for(let i=0;i<set-hatched;i++){ label++; Store.add('eggs',{batchId:batch.id,label:String(label),status:'unknown',breedId}); }
  }
  let added=0;
  if(phToFlock.checked && hatched>0){
    const pre=phPrefix.value.trim()||'Chick';
    for(let i=1;i<=hatched;i++) Store.add('birds',{name:`${pre} ${i}`,breedId,sex:'unsexed',status:'active',batchId:batch.id,dob:hatchDate});
    added=hatched;
  }
  SYNCING=false; scheduleSync();
  closeModal();
  toast(`Logged ${name} — ${hatched}/${set} hatched${added?`, ${added} in flock`:''}`);
  if(CUR==='flock') vFlock(); else vHatch();
}

/* edit an existing batch — fix a name mistake or adjust breed/count/date.
   Candled eggs are preserved when lowering the count; only blanks get removed. */
function openEditBatch(id){
  const b=Store.get('batches',id); if(!b) return;
  const breeds=Store.all('breeds');
  const cur=batchEggs(id).length;
  const dval=new Date(b.setDate).toISOString().slice(0,10);
  const body=`<h2>Edit batch</h2><p class="msub">Fix the name or details. Lowering the egg count only removes un-candled blanks — your candling marks are kept.</p>
    <div class="field"><label>Batch name</label><input id="ebName" value="${esc(b.name)}"></div>
    <div class="field"><label>Primary breed</label><select id="ebBreed">${breeds.map(x=>`<option value="${x.id}" data-sp="${esc(x.species)}" data-inc="${x.inc}" ${x.id===b.breedId?'selected':''}>${esc(x.name)} (${x.inc}d)</option>`).join('')}</select></div>
    <div class="grid g2" style="gap:12px">
      <div class="field"><label>Eggs set</label><input id="ebCount" type="number" value="${cur}" min="1" max="200"></div>
      <div class="field"><label>Date set</label><input id="ebDate" type="date" value="${dval}"></div></div>`;
  const footer=`<button class="btn btn-ghost" style="flex:0 0 auto;color:var(--quit)" onclick="deleteBatch('${id}')">Delete</button>
    <button class="btn btn-ghost" onclick="openBatch('${id}')">Cancel</button>
    <button class="btn btn-primary" id="ebSave">Save</button>`;
  modalRaw(body,footer);
  document.getElementById('ebSave').onclick=()=>{
    const name=ebName.value.trim();
    if(!name){ toast('Name the batch'); return; }
    const opt=ebBreed.selectedOptions[0];
    const inc=+opt.dataset.inc||21, sp=opt.dataset.sp, newBreed=ebBreed.value;
    const setDate=ebDate.value?new Date(ebDate.value).getTime():b.setDate;
    const hatchDate=setDate+inc*86400000;
    const eggs=batchEggs(id), curN=eggs.length;
    const n=Math.max(1,Math.min(200,+ebCount.value||curN));
    if(n>curN){
      let mx=eggs.reduce((m,e)=>Math.max(m,parseInt(e.label)||0),0);
      for(let i=curN;i<n;i++){ mx++; Store.add('eggs',{batchId:id,label:String(mx),status:'unknown',breedId:newBreed}); }
    } else if(n<curN){
      const blanks=eggs.filter(e=>e.status==='unknown').sort((a,z)=>(parseInt(z.label)||0)-(parseInt(a.label)||0));
      let need=curN-n;
      if(need>blanks.length){ need=blanks.length; toast('Kept candled eggs — removed blanks only'); }
      const rm=new Set(blanks.slice(0,need).map(e=>e.id));
      if(rm.size){
        Store.save('eggs',Store.all('eggs').filter(e=>!rm.has(e.id)));
        Store.save('candlingRecords',Store.all('candlingRecords').filter(r=>!rm.has(r.eggId)));
      }
    }
    if(newBreed!==b.breedId){ batchEggs(id).forEach(e=>Store.update('eggs',e.id,{breedId:newBreed})); }
    Store.update('batches',id,{name,breedId:newBreed,species:sp,setDate,hatchDate});
    openBatch(id); toast('Batch updated');
  };
}

let candleCtx='batch';
function candleEgg(eggId){
  const e=Store.get('eggs',eggId);
  const order=['unknown','fertile','clear','quitter'];
  // in batch view, cycle through candling states
  const next=order[(order.indexOf(e.status)+1)%order.length];
  Store.update('eggs',eggId,{status:next});
  Store.add('candlingRecords',{eggId,batchId:e.batchId,day:daysBetween(Store.get('batches',e.batchId).setDate,Date.now()),result:next,date:Date.now()});
  // refresh whichever view is open
  if(document.getElementById('modalBg').classList.contains('on')){
    if(CUR==='candle') openCandleBatch(e.batchId); else openBatch(e.batchId);
  }
}
function hatchBatch(id){
  const eggs=batchEggs(id);
  const fertile=eggs.filter(e=>e.status==='fertile');
  if(!fertile.length){ toast('Mark fertile eggs by candling first'); return; }
  fertile.forEach(e=>Store.update('eggs',e.id,{status:'hatched'}));
  Store.update('batches',id,{status:'hatched'});
  toast(`${fertile.length} chicks hatched 🐣`);
  closeModal();
  setTimeout(()=>addHatchedToFlock(id),300);
}
function addHatchedToFlock(id){
  const b=Store.get('batches',id);
  const hatched=batchEggs(id).filter(e=>e.status==='hatched');
  const existing=Store.all('birds').filter(x=>x.batchId===id).length;
  const toAdd=hatched.length-existing;
  if(toAdd<=0){ toast('All chicks already in your flock'); closeModal(); go('flock'); return; }
  modal(`<h2>Add chicks to flock</h2><p class="msub">${toAdd} hatched ${toAdd===1?'chick':'chicks'} from ${esc(b.name)} can join your flock.</p>
    <div class="field"><label>Name prefix</label><input id="cPrefix" value="${esc(b.name.split(' ')[0])} chick"></div>
    <div style="font-size:12.5px;color:var(--muted)">They'll inherit the batch breed (${esc(breedName(b.breedId))}) and be marked hatched here.</div>`,
    `Add ${toAdd} to flock`,()=>{
      const pre=cPrefix.value.trim()||'Chick';
      for(let i=1;i<=toAdd;i++) Store.add('birds',{name:`${pre} ${existing+i}`,breedId:b.breedId,sex:'unsexed',status:'active',batchId:id,dob:Date.now()});

    });
}

/* ---------- MEDIA (device-local photos via IndexedDB) ---------- */
const Media={
  db:null,
  open(){ return new Promise((res,rej)=>{ if(Media.db) return res(Media.db);
    const r=indexedDB.open('coopkey-media',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('images',{keyPath:'id'}); };
    r.onsuccess=()=>{ Media.db=r.result; res(Media.db); };
    r.onerror=()=>rej(r.error); }); },
  async put(id,data){ const db=await Media.open(); return new Promise((res,rej)=>{ const tx=db.transaction('images','readwrite'); tx.objectStore('images').put({id,data}); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
  async get(id){ const db=await Media.open(); return new Promise((res)=>{ const tx=db.transaction('images','readonly'); const rq=tx.objectStore('images').get(id); rq.onsuccess=()=>res(rq.result?rq.result.data:null); rq.onerror=()=>res(null); }); },
  async del(id){ try{ const db=await Media.open(); return new Promise((res)=>{ const tx=db.transaction('images','readwrite'); tx.objectStore('images').delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }catch(e){} },
};
function compressImage(file,maxDim=1400,quality=0.72){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{ res(c.toDataURL('image/jpeg',quality)); }catch(e){ rej(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}
async function hydratePhotos(){
  const nodes=document.querySelectorAll('[data-img]');
  for(const n of nodes){
    const id=n.getAttribute('data-img'); n.removeAttribute('data-img');
    const data=await Media.get(id);
    const rm=n.querySelector('.rm');
    n.innerHTML = data?`<img src="${data}" alt="">`:`<div class="ph">missing</div>`;
    if(rm) n.appendChild(rm);
  }
}

function getBiz(){ return Store.all('biz')[0]||{}; }
function saveBiz(obj){ const cur=getBiz(); if(cur.id) Store.update('biz',cur.id,obj); else Store.add('biz',{id:'profile',...obj}); }
function money(n){ return '$'+(Math.round((+n||0)*100)/100).toFixed(2); }
function invoiceTotal(inv){
  const sub=(inv.items||[]).reduce((s,it)=>s+(+it.qty||0)*(+it.price||0),0);
  const tax=sub*((+inv.taxRate||0)/100);
  return {sub,tax,total:sub+tax};
}
function tradeTotals(inv){
  const gaveTotal=(inv.gave||[]).reduce((s,it)=>s+(+it.qty||0)*(+it.value||0),0);
  const gotTotal=(inv.got||[]).reduce((s,it)=>s+(+it.qty||0)*(+it.value||0),0);
  return {gaveTotal,gotTotal,diff:gotTotal-gaveTotal};
}

var INV_ID=null, PAYRM=null, PAYCTX=null;
const DEFAULT_LN='Jinishian@cake.cash'; // used until you save a different address in Business details
function getLnAddr(){ const b=getBiz(); return ((b.ln!==undefined?b.ln:DEFAULT_LN)||'').trim(); }
function lnValid(a){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a||''); }
function r2(n){ return Math.round((+n||0)*100)/100; }
function satsFmt(n){ return Math.round(+n||0).toLocaleString(); }

/* payment ledger: inv.payments = [{id,method:'cash'|'barter'|'lightning',usd,ts,note,desc,sats,rate}] */
function payList(inv){
  if(inv.payments&&inv.payments.length) return inv.payments;
  if(inv.paid) return [{id:'legacy',method:inv.paidMethod==='lightning'?'lightning':'cash',usd:inv.paidUsd||invoiceTotal(inv).total,ts:inv.paidAt||inv._ts,sats:inv.paidSats||null,rate:inv.paidRate||null}];
  return [];
}
function payReceived(inv){ return r2(payList(inv).reduce((s,p)=>s+(+p.usd||0),0)); }
function payBalance(inv,total){ if(total===undefined) total=invoiceTotal(inv).total; return Math.max(0,r2(total-payReceived(inv))); }
function payStatus(inv,total){
  if(total===undefined) total=invoiceTotal(inv).total;
  const rec=payReceived(inv);
  if(total>0&&rec>=total-0.005) return 'paid';
  return rec>0?'partial':'unpaid';
}
function payTag(st){ return st==='paid'?'<span class="tag alive">Paid</span>':st==='partial'?'<span class="tag info">Partial</span>':'<span class="tag amber">Unpaid</span>'; }
function payLabel(p){
  if(p.method==='barter') return 'Barter'+(p.desc?': '+p.desc:'');
  if(p.method==='lightning') return 'Lightning'+(p.sats?' ('+satsFmt(p.sats)+' sats)':'');
  return 'Cash'+(p.note?' ('+p.note+')':'');
}

/* QR + clipboard + price + LNURL helpers */
function qrSvg(text,px,mode,ecc){
  try{
    const q=qrcode(0,ecc||'M'); q.addData(text,mode||'Byte'); q.make();
    return q.createSvgTag({cellSize:4,margin:4,scalable:true})
      .replace('<svg ','<svg style="width:'+px+'px;height:'+px+'px;display:block;border-radius:8px" ');
  }catch(e){ return ''; }
}
function copyText(t){
  const done=()=>toast('Copied');
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed'); } ta.remove(); };
  try{ if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t).then(done,fallback); return; } }catch(e){}
  fallback();
}
let BTC_USD=null, BTC_USD_TS=0;
async function timedJson(url,ms){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms||7000);
  try{ const r=await fetch(url,{signal:ctl.signal}); return await r.json(); } finally{ clearTimeout(t); }
}
async function getBtcUsd(){
  if(BTC_USD&&Date.now()-BTC_USD_TS<300000) return BTC_USD;
  let v=null;
  try{ v=+(await timedJson('https://mempool.space/api/v1/prices',6000)).USD; }catch(e){}
  if(!(v>0)){ try{ v=+(await timedJson('https://api.coinbase.com/v2/prices/BTC-USD/spot',6000)).data.amount; }catch(e){} }
  if(v>0){ BTC_USD=v; BTC_USD_TS=Date.now(); return v; }
  return null;
}
async function lnurlInvoice(addr,msats,comment){
  const [user,domain]=addr.split('@');
  const meta=await timedJson(`https://${domain}/.well-known/lnurlp/${encodeURIComponent(user.toLowerCase())}`,8000);
  if(!meta||!meta.callback) throw new Error('No LNURL callback');
  if(meta.minSendable&&msats<meta.minSendable) throw new Error('Below wallet minimum');
  if(meta.maxSendable&&msats>meta.maxSendable) throw new Error('Above wallet maximum');
  const u=new URL(meta.callback); u.searchParams.set('amount',String(msats));
  if(comment&&meta.commentAllowed) u.searchParams.set('comment',comment.slice(0,meta.commentAllowed));
  const inv=await timedJson(u.toString(),8000);
  if(!inv||!inv.pr) throw new Error((inv&&inv.reason)||'No invoice returned');
  return inv.pr;
}

/* Payment sheets */
function payBack(){
  const c=PAYCTX; PAYCTX=null;
  if(c&&c.back==='form') openInvoiceForm(c.id);
  else { closeModal(); if(CUR==='invoices') vInvoices(); }
}
function addLedger(id,entry){
  const inv=Store.get('invoices',id); if(!inv) return;
  const list=payList(inv).slice(); list.push({id:uid(),ts:Date.now(),...entry});
  Store.update('invoices',id,{payments:list,paid:null,paidMethod:null,paidAt:null,paidUsd:null,paidSats:null,paidRate:null});
}
function openPaySheet(id,method,back){
  const inv=Store.get('invoices',id); if(!inv||inv.kind==='trade') return;
  const total=invoiceTotal(inv).total, bal=payBalance(inv,total);
  PAYCTX={id,method,back:back||'list',total,bal,sats:null,rate:null,pr:null,state:'loading',err:''};
  if(method==='lightning') return openLnSheet();
  const barter=method==='barter';
  modalRaw(`<h2>${barter?'Barter payment':'Cash payment'} <span class="mono" style="font-size:13px;color:var(--faint)">${invoiceLabel(inv)}</span></h2>
    <p class="msub">Balance due ${money(bal)}</p>
    ${barter?`<div class="field"><label>What was received</label><input id="payDesc" placeholder="e.g. 2 dozen duck eggs"></div>`:''}
    <div class="field"><label>${barter?'Estimated value ($)':'Amount ($)'}</label><input id="payAmt" type="number" step="0.01" inputmode="decimal" value="${bal.toFixed(2)}"></div>
    ${barter?'':`<div class="field"><label>Note (optional)</label><input id="payNote" placeholder="e.g. paid at pickup"></div>`}`,
    `<button class="btn btn-ghost" onclick="payBack()">Cancel</button><button class="btn btn-primary" onclick="savePay()">Record</button>`);
}
function savePay(){
  const c=PAYCTX; if(!c) return;
  const amt=r2(document.getElementById('payAmt').value);
  if(!(amt>0)){ toast('Enter an amount'); return; }
  const barter=c.method==='barter';
  const entry={method:c.method,usd:amt};
  if(barter){ entry.desc=(document.getElementById('payDesc').value||'').trim()||'Goods'; }
  else { const n=(document.getElementById('payNote').value||'').trim(); if(n) entry.note=n; }
  addLedger(c.id,entry);
  toast('Payment recorded'); payBack();
}
async function openLnSheet(){
  const c=PAYCTX; const inv=Store.get('invoices',c.id);
  if(c.bal<=0){ toast('Nothing left to pay'); payBack(); return; }
  c.addr=getLnAddr();
  modalRaw('<div id="payBody"></div>','');
  renderLnSheet();
  if(!lnValid(c.addr)) return;
  const rate=await getBtcUsd();
  if(PAYCTX!==c) return;
  if(!rate){ c.state='norate'; renderLnSheet(); return; }
  c.rate=rate; c.sats=Math.max(1,Math.round(c.bal/rate*1e8)); renderLnSheet();
  try{
    const pr=await lnurlInvoice(c.addr,c.sats*1000,'Invoice '+invoiceLabel(inv));
    if(PAYCTX!==c) return;
    c.pr=pr; c.state='invoice';
  }catch(e){
    if(PAYCTX!==c) return;
    c.state='addronly'; c.err=e&&e.message?e.message:'';
  }
  renderLnSheet();
}
function renderLnSheet(){
  const box=document.getElementById('payBody'); const P=PAYCTX; if(!box||!P) return;
  const inv=Store.get('invoices',P.id); if(!inv){ closeModal(); return; }
  let h=`<h2>Pay with Lightning <span class="mono" style="font-size:13px;color:var(--faint)">${invoiceLabel(inv)}</span></h2>
    <p class="msub">${P.sats?`${money(P.bal)} balance &asymp; <strong style="color:var(--cream)">${satsFmt(P.sats)} sats</strong>`:`${money(P.bal)} balance`}</p>`;
  let canMark=true;
  if(!lnValid(P.addr)){
    canMark=false;
    h+=`<div class="card" style="padding:14px;margin-bottom:14px"><div class="ttl">Add your Lightning address</div>
      <div class="meta">Put it in Business details and it will show here and on printed invoices.</div>
      <button class="btn btn-ghost" style="width:auto;margin-top:10px" onclick="openBiz()">Business details</button></div>`;
  } else {
    let qrHtml='', note='', link='';
    if(P.state==='invoice'){
      qrHtml=qrSvg('LIGHTNING:'+P.pr.toUpperCase(),236,'Alphanumeric','L');
      note='Exact-amount Lightning invoice. It expires after a while, so tap Refresh if the customer pays later.';
      link=`<a class="linkbtn" href="lightning:${P.pr}" style="display:inline-block;margin-right:14px">Open in wallet</a><button class="linkbtn" onclick="copyText(PAYCTX.pr)">Copy invoice</button> `;
    } else {
      qrHtml=qrSvg('lightning:'+P.addr,236,'Byte','M');
      if(P.state==='norate') note='Could not get the BTC price (offline?). This QR pays your Lightning address; the customer enters the amount.';
      else if(P.state==='addronly') note='Could not create an exact-amount invoice'+(P.err?` (${esc(P.err)})`:'')+'. This QR pays your Lightning address'+(P.sats?`; ask for about ${satsFmt(P.sats)} sats.`:'.');
      else note='Getting the exact amount&hellip; you can already scan this QR to pay the address.';
    }
    h+=`<div style="display:flex;justify-content:center;margin:4px 0 12px">${qrHtml}</div>
      <div class="meta" style="text-align:center;margin-bottom:10px">${note}</div>
      <div style="text-align:center;margin-bottom:12px">${link}<button class="linkbtn" onclick="copyText(PAYCTX.addr)">Copy address</button>${P.state!=='loading'?` <button class="linkbtn" style="margin-left:14px" onclick="refreshLn()">Refresh</button>`:''}</div>
      <div class="mono" style="text-align:center;font-size:12px;color:var(--faint);word-break:break-all">${esc(P.addr)}</div>`;
  }
  box.innerHTML=h;
  const actions=document.querySelector('#modal .modal-actions');
  if(actions) actions.innerHTML=`<button class="btn btn-ghost" onclick="payBack()">Back</button>${canMark?`<button class="btn btn-primary" onclick="lnReceived()">Mark received</button>`:''}`;
}
function refreshLn(){ const c=PAYCTX; if(!c) return; PAYCTX={id:c.id,method:'lightning',back:c.back,total:c.total,bal:c.bal,sats:null,rate:null,pr:null,state:'loading',err:''}; openLnSheet(); }
function lnReceived(){
  const c=PAYCTX; if(!c) return;
  addLedger(c.id,{method:'lightning',usd:c.bal,sats:c.sats||null,rate:c.rate||null});
  toast('Lightning payment recorded'); payBack();
}

/* Printed invoice: payments received + payment QR or PAID stamp */
function payBlockHtml(inv,total){
  const list=payList(inv), st=payStatus(inv,total), bal=payBalance(inv,total);
  let h='';
  if(list.length){
    h+=`<div style="margin-top:24px;font-size:12px;color:#555"><div style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#999;margin-bottom:6px">Payments received</div>`
      +list.map(p=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${fmtDate(p.ts)} &middot; ${esc(payLabel(p))}</span><span>${money(p.usd)}</span></div>`).join('')
      +`<div style="display:flex;justify-content:space-between;padding:7px 0 0;margin-top:4px;border-top:1px solid #e6e1d6;font-weight:bold;color:#1a1a1a"><span>Balance due</span><span>${money(bal)}</span></div></div>`;
  }
  if(st==='paid') return h+`<div style="margin-top:22px"><span style="display:inline-block;border:3px solid #3f7d3a;color:#3f7d3a;font-weight:bold;font-size:22px;letter-spacing:4px;padding:4px 16px;transform:rotate(-4deg)">PAID</span></div>`;
  const a=getLnAddr(); if(!lnValid(a)) return h;
  return h+`<div style="margin-top:26px;display:flex;gap:18px;align-items:center;border-top:1px solid #e6e1d6;padding-top:18px">
    <div style="flex:0 0 auto">${qrSvg('lightning:'+a,112,'Byte','M')}</div>
    <div style="font-size:12px;color:#555;line-height:1.6"><div style="font-weight:bold;color:#1a1a1a;font-size:13px">Pay with Bitcoin Lightning</div>
    <div style="font-family:monospace;word-break:break-all">${esc(a)}</div>
    <div>Amount due: ${money(bal)}. Scan or send to this Lightning address.</div></div></div>`;
}

/* ---------- SHIPMENTS ---------- */
const SHIP_KINDS=['Hatching eggs','Chicks','Juveniles','Adult birds','Other'];
const SHIP_STATUS=[['ordered','Ordered','info'],['shipped','Shipped','amber'],['transit','In transit','amber'],['delivered','Delivered','alive'],['issue','Problem','quit']];
function shipmentDate(s){ return s.arrivalDate||s.shipDate||s.orderDate||s._ts; }
function shipStatusMeta(id){ return SHIP_STATUS.find(x=>x[0]===id)||SHIP_STATUS[0]; }

function vShipments(){
  const ships=Store.all('shipments').sort((a,b)=>shipmentDate(b)-shipmentDate(a));
  let html=`<div class="head"><div class="head-row"><div>
    <div class="eyebrow">Incoming</div><h1>Shipments</h1>
    <p>Track birds and eggs you've ordered, from order to arrival — including how they showed up.</p></div>
    <button class="btn btn-primary" style="width:auto" onclick="openShipmentForm()"><span class="ic" style="width:16px;color:#2a1c08">${I.plus}</span>New shipment</button>
  </div></div>`;
  if(!ships.length){
    html+=`<div class="card"><div class="empty"><div class="ee"></div>
      <h3>No shipments yet</h3><p>Log a bird or hatching-egg order to track its arrival, record losses, and roll the cost into your expenses automatically.</p>
      <button class="btn btn-primary" style="display:inline-flex;width:auto" onclick="openShipmentForm()">Log a shipment</button></div></div>`;
    return document.getElementById('view').innerHTML=html;
  }
  const ordered=ships.reduce((s,x)=>s+(+x.qtyOrdered||0),0);
  const received=ships.reduce((s,x)=>s+(x.qtyReceived==null?0:+x.qtyReceived||0),0);
  const lost=ships.reduce((s,x)=>s+(+x.losses||0),0);
  const spent=ships.reduce((s,x)=>s+(+x.cost||0),0);
  html+=`<div class="grid g4">
    ${stat('Shipments',ships.length,'logged')}
    ${stat('Birds ordered',ordered,'across all orders')}
    ${stat('Losses',lost, lost===1?'reported':'reported',lost?'quit':'')}
    ${stat('Spent',money(spent),'on shipments','quit')}
  </div>`;
  html+=`<div class="section-title">All shipments</div><div class="list">`;
  html+=ships.map(s=>{
    const m=shipStatusMeta(s.status);
    const breed=s.breedId?(Store.get('breeds',s.breedId)||{}).name:'';
    const what=[s.qtyOrdered?s.qtyOrdered:'',breed,(s.kind||'')].filter(Boolean).join(' ');
    return `<div class="row" style="cursor:pointer" onclick="openShipmentForm('${s.id}')">
      <div class="grow"><div class="ttl">${esc(s.source||'Shipment')}${s.cost?` · ${money(s.cost)}`:''}</div>
      <div class="meta">${esc(what||'—')} · ${fmtDate(shipmentDate(s))}${(s.qtyReceived!=null)?` · ${s.qtyReceived} arrived${s.losses?`, ${s.losses} lost`:''}`:''}</div></div>
      <span class="tag ${m[2]}"><span class="dot"></span>${m[1]}</span></div>`;
  }).join('')+`</div>`;
  document.getElementById('view').innerHTML=html;
}

    <div class="section-title" style="margin:18px 0 10px">Result on arrival</div>
    <div class="grid g2" style="gap:12px">
      <div class="field"><label>Quantity received</label><input id="shRecv" type="number" min="0" max="100000" value="${s&&s.qtyReceived!=null?s.qtyReceived:''}" placeholder="—"></div>
      <div class="field"><label>Losses / DOA</label><input id="shLoss" type="number" min="0" max="100000" value="${s?(s.losses||''):''}" placeholder="0"></div>

    <div class="field"><label>Result notes</label><textarea id="shNote" rows="3" placeholder="How did they arrive? Condition, supplier response, anything to remember for next order.">${s?esc(s.resultNote||''):''}</textarea></div>`;
  const footer=(s?`<button class="btn btn-ghost" style="flex:0 0 auto;color:var(--quit)" onclick="deleteShipment('${id}')">Delete</button>`:'')
    +`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="shSave">Save</button>`;

function deleteShipment(id){
  const s=Store.get('shipments',id); if(!s) return;
  modal(`<h2>Delete shipment?</h2><p class="msub">The "${esc(s.source||'shipment')}" order${s.cost?` (${money(s.cost)})`:''} and its result notes will be removed. Its cost will no longer count toward expenses.</p>`,
    'Delete',()=>{ Store.remove('shipments',id); vShipments(); toast('Shipment deleted'); });
}

/* ---------- EXPENSES / FINANCES ---------- */
const EXP_CATS=['Feed','Bedding','Equipment','Livestock','Health/Vet','Utilities','Supplies','Marketing','Other'];
let financeRange='12mo';

function monthsSpan(a,b){ return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); }
function computeFinance(range){
  const invoices=Store.all('invoices'), expenses=Store.all('expenses'), shipments=Store.all('shipments');
  const now=new Date();
  let start;
  if(range==='ytd') start=new Date(now.getFullYear(),0,1);
  else if(range==='all'){
    const ds=[...invoices.map(i=>i.date||i._ts),...expenses.map(e=>e.date||e._ts),...shipments.map(sh=>shipmentDate(sh))];
    start=ds.length?new Date(Math.min(...ds)):new Date(now.getFullYear(),now.getMonth(),1);
    start=new Date(start.getFullYear(),start.getMonth(),1);
  } else start=new Date(now.getFullYear(),now.getMonth()-11,1);
  const startTs=start.getTime();
  const inInc=invoices.filter(i=>(i.date||i._ts)>=startTs).map(i=>({date:i.date||i._ts,amt:invoiceTotal(i).total}));
  const inExpRaw=expenses.filter(e=>(e.date||e._ts)>=startTs).map(e=>({date:e.date||e._ts,amt:+e.amount||0,category:e.category||'Other'}));
  const inShip=shipments.filter(sh=>shipmentDate(sh)>=startTs && (+sh.cost||0)>0).map(sh=>({date:shipmentDate(sh),amt:+sh.cost||0,category:'Bird shipments'}));
  const inExp=[...inExpRaw,...inShip];
  const income=inInc.reduce((s,x)=>s+x.amt,0), expense=inExp.reduce((s,x)=>s+x.amt,0);
  const span=monthsSpan(start,new Date(now.getFullYear(),now.getMonth(),1));
  const yearly=span>14;
  const buckets=[], idx={};
  if(yearly){
    for(let y=start.getFullYear();y<=now.getFullYear();y++){ idx[y]=buckets.length; buckets.push({key:String(y),label:String(y),income:0,expense:0}); }
    const kf=ts=>String(new Date(ts).getFullYear());
    inInc.forEach(x=>{const b=buckets[idx[kf(x.date)]]; if(b)b.income+=x.amt;});
    inExp.forEach(x=>{const b=buckets[idx[kf(x.date)]]; if(b)b.expense+=x.amt;});
  } else {
    const multiYear=start.getFullYear()!==now.getFullYear();
    let cur=new Date(start.getFullYear(),start.getMonth(),1), last=new Date(now.getFullYear(),now.getMonth(),1);
    while(cur<=last){
      const key=cur.getFullYear()+'-'+cur.getMonth();
      const label=cur.toLocaleDateString(undefined,{month:'short'})+(multiYear?" '"+String(cur.getFullYear()).slice(2):'');
      idx[key]=buckets.length; buckets.push({key,label,income:0,expense:0}); cur.setMonth(cur.getMonth()+1);
    }
    const kf=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth();};
    inInc.forEach(x=>{const b=buckets[idx[kf(x.date)]]; if(b)b.income+=x.amt;});
    inExp.forEach(x=>{const b=buckets[idx[kf(x.date)]]; if(b)b.expense+=x.amt;});
  }
  const cmap={}; inExp.forEach(x=>{cmap[x.category]=(cmap[x.category]||0)+x.amt;});
  const cats=Object.entries(cmap).map(([cat,amt])=>({cat,amt})).sort((a,b)=>b.amt-a.amt);
  return {income,expense,net:income-expense,buckets,cats,startTs};
}
function chartIncomeExpense(buckets){
  const W=Math.max(320,buckets.length*46+24),H=180,padR=10,padL=10,padB=24,padT=8;
  const plotH=H-padB-padT, baseY=padT+plotH;
  const max=Math.max(1,...buckets.map(b=>Math.max(b.income,b.expense)));
  const groupW=(W-padL-padR)/buckets.length;
  const bw=Math.max(5,Math.min(16,(groupW-10)/2));
  let bars='';
  buckets.forEach((b,i)=>{
    const cx=padL+groupW*i+groupW/2;
    const ih=plotH*(b.income/max), eh=plotH*(b.expense/max);
    bars+=`<rect x="${(cx-bw-2).toFixed(1)}" y="${(baseY-ih).toFixed(1)}" width="${bw.toFixed(1)}" height="${ih.toFixed(1)}" rx="2" fill="var(--alive)"/>`;
    bars+=`<rect x="${(cx+2).toFixed(1)}" y="${(baseY-eh).toFixed(1)}" width="${bw.toFixed(1)}" height="${eh.toFixed(1)}" rx="2" fill="var(--quit)"/>`;
    bars+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)" font-family="var(--mono)">${b.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible">
    <line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--line)"/>${bars}</svg>`;
}
function vExpenses(){
  const f=computeFinance(financeRange);
  const allExp=Store.all('expenses');
  let html=`<div class="head"><div class="head-row"><div>
    <div class="eyebrow">Books</div><h1>Expenses</h1>
    <p>Track what you spend and see it against your invoiced income.</p></div>
    <button class="btn btn-primary" style="width:auto" onclick="openExpenseForm()"><span class="ic" style="width:16px;color:#2a1c08">${I.plus}</span>Add expense</button>
  </div></div>`;
  if(!allExp.length && !Store.all('invoices').length && !Store.all('shipments').length){
    html+=`<div class="card"><div class="empty"><div class="ee"></div>
      <h3>No money tracked yet</h3><p>Add an expense here, and create invoices in the Invoices tab. CoopKey charts your income against your costs.</p>
      <button class="btn btn-primary" style="display:inline-flex;width:auto" onclick="openExpenseForm()">Add an expense</button></div></div>`;
    return document.getElementById('view').innerHTML=html;
  }
  const ranges=[['12mo','12 months'],['ytd','This year'],['all','All time']];
  html+=`<div class="seg" style="margin-bottom:16px">${ranges.map(([k,l])=>`<button class="${financeRange===k?'on':''}" onclick="financeRange='${k}';vExpenses()">${l}</button>`).join('')}</div>`;
  const netStr=(f.net<0?'\u2212':'')+money(Math.abs(f.net));
  html+=`<div class="grid g3">
    ${stat('Income',money(f.income),'invoiced','alive')}
    ${stat('Expenses',money(f.expense),'this period','quit')}
    ${stat('Net',netStr,'income \u2212 expenses',f.net>=0?'alive':'quit')}
  </div>`;
  html+=`<div class="section-title">Income vs expenses</div>`;
  html+=card(`<div class="legend"><span><i style="background:var(--alive)"></i>Income</span><span><i style="background:var(--quit)"></i>Expenses</span></div>
    ${chartIncomeExpense(f.buckets)}
    <div style="font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.5">Income reflects invoiced totals (from the Invoices tab), not payments received. Expenses include bird-shipment costs.</div>`);
  if(f.cats.length){
    html+=`<div class="section-title">Where it goes</div>`;
    html+=card(f.cats.map(c=>{const pct=f.expense?Math.round(c.amt/f.expense*100):0;
      return `<div class="catrow"><div class="catrow-top"><span>${esc(c.cat)}</span><span class="mono">${money(c.amt)} \u00b7 ${pct}%</span></div>
        <div class="catbar"><i style="width:${pct}%"></i></div></div>`;}).join(''));
  }
  const items=[
    ...allExp.map(e=>({id:e.id,src:'expense',date:e.date||e._ts,amt:+e.amount||0,title:(e.category||'Other')+(e.vendor?' · '+e.vendor:''),sub:e.note||''})),
    ...Store.all('shipments').filter(sh=>(+sh.cost||0)>0).map(sh=>({id:sh.id,src:'shipment',date:shipmentDate(sh),amt:+sh.cost||0,title:'Bird shipment'+(sh.source?' · '+sh.source:''),sub:[sh.qtyOrdered?sh.qtyOrdered+' '+(sh.kind||'birds'):'',sh.resultNote].filter(Boolean).join(' · ')}))
  ].filter(x=>x.date>=f.startTs).sort((a,b)=>b.date-a.date);
  html+=`<div class="section-title">Expenses</div>`;
  if(items.length){
    html+=`<div class="list">`+items.map(x=>`<div class="row" style="cursor:pointer" onclick="${x.src==='shipment'?`openShipmentForm('${x.id}')`:`openExpenseForm('${x.id}')`}">
      <div class="grow"><div class="ttl">${esc(x.title)}${x.src==='shipment'?' <span class="tag info" style="font-size:10px;padding:1px 7px">shipment</span>':''}</div>
      <div class="meta">${fmtDate(x.date)}${x.sub?` · ${esc(x.sub)}`:''}</div></div>
      <div class="mono" style="font-size:15px;color:var(--quit)">−${money(x.amt)}</div></div>`).join('')+`</div>`;
  } else html+=card(`<div class="empty" style="padding:26px"><p>No expenses in this range.</p></div>`);
  document.getElementById('view').innerHTML=html;
}
function openExpenseForm(id){
  const e=id?Store.get('expenses',id):null;
  const dval=new Date(e?(e.date||e._ts):Date.now()).toISOString().slice(0,10);
  const body=`<h2>${e?'Edit expense':'Add expense'}</h2>
    <div class="grid g2" style="gap:12px">
      <div class="field"><label>Amount</label><input id="exAmt" type="number" min="0" step="0.01" value="${e?e.amount:''}" placeholder="0.00"></div>
      <div class="field"><label>Date</label><input id="exDate" type="date" value="${dval}"></div></div>
    <div class="field"><label>Category</label><select id="exCat">${EXP_CATS.map(c=>`<option ${e&&e.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Vendor <span style="color:var(--faint)">(opt.)</span></label><input id="exVendor" value="${e?esc(e.vendor||''):''}" placeholder="e.g. Tractor Supply"></div>
    <div class="field"><label>Note <span style="color:var(--faint)">(opt.)</span></label><input id="exNote" value="${e?esc(e.note||''):''}"></div>`;
  const footer=(e?`<button class="btn btn-ghost" style="flex:0 0 auto;color:var(--quit)" onclick="deleteExpense('${id}')">Delete</button>`:'')
    +`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="exSave">Save</button>`;
  modalRaw(body,footer);
  document.getElementById('exSave').onclick=()=>{
    const amt=Math.round((+exAmt.value||0)*100)/100;
    if(amt<=0){ toast('Enter an amount'); return; }
    const rec={amount:amt,date:exDate.value?new Date(exDate.value).getTime():Date.now(),category:exCat.value,vendor:exVendor.value.trim(),note:exNote.value.trim()};
    if(id) Store.update('expenses',id,rec); else Store.add('expenses',rec);
    closeModal(); vExpenses(); toast(id?'Expense updated':'Expense added');
  };
}
function deleteExpense(id){
  const e=Store.get('expenses',id); if(!e) return;
  modal(`<h2>Delete expense?</h2><p class="msub">${money(e.amount)} \u00b7 ${esc(e.category||'Other')} on ${fmtDate(e.date||e._ts)} will be removed.</p>`,
    'Delete',()=>{ Store.remove('expenses',id); vExpenses(); toast('Expense deleted'); });
}

/* ---------- THEMES ---------- */
const THEMES=[
  {id:'candle',label:'Candle',vars:{shell:'#16110D',panel:'#1F1812',panel2:'#271E16',line:'#382C20',cream:'#F3ECDD',muted:'#A99A84',faint:'#6E6253',yolk:'#F0A93B','yolk-soft':'#FFC566',alive:'#84B26A',clear:'#8A7E6E',quit:'#CC6F57',info:'#7BA7C4'}},
  {id:'forest',label:'Forest',vars:{shell:'#0F140F',panel:'#172017',panel2:'#1E2A1F',line:'#2C3A2E',cream:'#EAF1E3',muted:'#9DB094',faint:'#697A63',yolk:'#E7B24C','yolk-soft':'#FFD27E',alive:'#7FC169',clear:'#8E9683',quit:'#D27C5E',info:'#7FB0A6'}},
  {id:'dusk',label:'Dusk',vars:{shell:'#111219',panel:'#191B24',panel2:'#212433',line:'#323648',cream:'#E9EAF2',muted:'#9A9DB2',faint:'#65687E',yolk:'#EBB14E','yolk-soft':'#FFD07F',alive:'#7FBF8A',clear:'#8A8DA0',quit:'#D9826A',info:'#7FA8D8'}},
  {id:'plum',label:'Plum',vars:{shell:'#15101A',panel:'#1E1726',panel2:'#271E31',line:'#3A2E44',cream:'#F0E8F0',muted:'#B098B0',faint:'#7A6680',yolk:'#E9A878','yolk-soft':'#FFC79A',alive:'#93B86F',clear:'#9A8E9A',quit:'#D77A7A',info:'#9F8BD0'}},
  {id:'eggshell',label:'Eggshell',vars:{shell:'#F4EFE4',panel:'#FBF7EE',panel2:'#FFFFFF',line:'#E4DBCB',cream:'#2A2118',muted:'#6E6253',faint:'#A99A84',yolk:'#D8932B','yolk-soft':'#EFAE4A',alive:'#5E9B47',clear:'#9A8E7E',quit:'#C25638',info:'#4E86A6'}},
];
let CURRENT_THEME='candle';
function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  const r=document.documentElement.style;
  Object.entries(t.vars).forEach(([k,v])=>r.setProperty('--'+k,v));
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content',t.vars.shell);
  try{ localStorage.setItem('ck.theme',t.id); }catch(e){}
  CURRENT_THEME=t.id;
}
function setTheme(id){ applyTheme(id); if(CUR==='settings') vSettings(); toast('Theme applied'); }

/* ---------- SETTINGS ---------- */
function vSettings(){
  const counts={birds:Store.all('birds').length,batches:Store.all('batches').length,
    eggs:Store.all('eggs').length,breeds:Store.all('breeds').filter(b=>!b.system).length,expenses:Store.all('expenses').length};
  let html=`<div class="head"><div class="eyebrow">Account</div><h1>Settings</h1></div>`;

  html+=card(`<div style="display:flex;align-items:center;gap:14px">
    <div class="avatar" style="width:46px;height:46px;font-size:17px">${(ME.name||'K').slice(0,2).toUpperCase()}</div>
    <div class="grow"><div style="font-weight:700;font-size:16px">${esc(ME.name)}</div>
    <div style="color:var(--muted);font-size:13px">${esc(ME.email)}</div></div>
    <span class="tag ${ME.plan==='pro'?'amber':''}">${ME.plan==='pro'?'Pro':'Free'}</span></div>`,'pad-lg');

  // cross-device sync
  html+=`<div class="section-title">Appearance</div>`;
  html+=card(`<div style="font-size:13px;color:var(--muted);margin-bottom:13px;line-height:1.5">Pick a color theme for this device.</div>
    <div class="theme-grid">${THEMES.map(t=>`<button class="theme-opt ${CURRENT_THEME===t.id?'on':''}" onclick="setTheme('${t.id}')">
      <span class="theme-sw"><i style="background:${t.vars.shell}"></i><i style="background:${t.vars.yolk}"></i></span>
      <span>${t.label}</span></button>`).join('')}</div>`);

  html+=`<div class="section-title">Sync across devices</div>`;
  if(Cloud.on()){
    html+=card(`<div class="row" style="border:none;padding:6px 0 14px">
        <div class="grow"><div class="ttl">Cloud sync is on</div>
        <div class="meta">${esc(Cloud.base())}</div></div>
        <span class="tag ${SYNC_STATE==='synced'?'alive':SYNC_STATE==='offline'?'quit':'info'}"><span class="dot"></span>${SYNC_STATE}</span></div>
      <div class="row" style="border:none;border-top:1px solid var(--line);padding:14px 0 4px">
        <div class="grow"><div class="ttl">Sync now</div><div class="meta">Push and pull the latest from all your devices</div></div>
        <button class="btn btn-ghost" style="width:auto" onclick="forceSync()">Sync now</button></div>
      <div class="row" style="border:none;border-top:1px solid var(--line);padding:14px 0 4px">
        <div class="grow"><div class="ttl">Disconnect</div><div class="meta">Stops syncing this device; local data stays</div></div>
        <button class="btn btn-ghost" style="width:auto;color:var(--quit)" onclick="disconnectCloud()">Disconnect</button></div>`);
  } else {
    html+=card(`<div style="font-size:13.5px;color:var(--muted);margin-bottom:14px;line-height:1.6">Log your flock from your desktop and have it on your phone at the coop. Paste the API URL from your deploy package, then sign in to your cloud account. <strong style="color:var(--cream)">Tip:</strong> export your data first (below), then re-import after signing in.</div>
      <div class="field"><label>CoopKey API URL</label><input id="cloudUrl" placeholder="https://coopkey-api.yourname.workers.dev"></div>
      <button class="btn btn-primary" style="width:auto" onclick="connectCloud()">Connect &amp; enable sync</button>`);
  }

  // monetization surface
  html+=`<div class="section-title">Plan</div>`;
  html+=`<div class="grid g2">
    <div class="card pad-lg" style="${ME.plan==='free'?'border-color:var(--yolk)':''}">
      <div class="eyebrow">Free</div><div style="font-family:var(--display);font-size:28px;margin:6px 0">$0</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7">1 flock · 2 active batches<br>Candling + hatch tracking<br>Local data</div>
      ${ME.plan==='free'?'<div class="tag" style="margin-top:14px">Current plan</div>':`<button class="btn btn-ghost" style="margin-top:14px;width:100%" onclick="switchPlan('free')">Switch to Free</button>`}</div>
    <div class="card pad-lg" style="${ME.plan==='pro'?'border-color:var(--yolk)':''}">
      <div class="eyebrow" style="color:var(--yolk)">Pro</div><div style="font-family:var(--display);font-size:28px;margin:6px 0">$6<span style="font-size:14px;color:var(--muted)">/mo</span></div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7">Unlimited flocks & batches<br>Cloud sync across devices<br>Season reports & exports</div>
      ${ME.plan==='pro'?'<div class="tag amber" style="margin-top:14px">Current plan</div>':`<button class="btn btn-primary" style="margin-top:14px;width:100%" onclick="switchPlan('pro')">Upgrade to Pro</button>`}</div>
  </div>`;

  html+=`<div class="section-title">Invoicing</div>`;
  html+=card(`<div class="row" style="padding:6px 0 4px;border:none"><div class="grow"><div class="ttl">Business details</div>
      <div class="meta">${getBiz().name?esc(getBiz().name):'Not set — these appear on your invoices'}</div></div>
      <button class="btn btn-ghost" style="width:auto" onclick="openBiz()">${getBiz().name?'Edit':'Set up'}</button></div>`);

  html+=`<div class="section-title">Your data</div>`;
  html+=card(`<div class="row" style="padding:14px 0;border:none">
      <div class="grow"><div class="ttl">Export everything</div>
      <div class="meta">${counts.birds} birds · ${counts.batches} batches · ${counts.eggs} eggs · ${counts.breeds} custom breeds · ${counts.expenses} expenses</div></div>
      <button class="btn btn-ghost" style="width:auto" onclick="exportData()">Download JSON</button></div>
    <div class="row" style="padding:14px 0 4px;border:none;border-top:1px solid var(--line)">
      <div class="grow"><div class="ttl">Import</div><div class="meta">Restore from a CoopKey export</div></div>
      <label class="btn btn-ghost" style="width:auto">Choose file<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div>`);

  html+=`<div style="margin-top:24px"><button class="btn btn-ghost" onclick="signOut()" style="width:auto;color:var(--quit)">Sign out</button></div>`;
  html+=`<div style="text-align:center;color:var(--faint);font-size:11px;font-family:var(--mono);letter-spacing:.08em;margin-top:34px">CoopKey · v${VERSION} · beta</div>`;
  document.getElementById('view').innerHTML=html;
}
function switchPlan(p){ Auth.setPlan(ME.email,p); ME.plan=p; plD.textContent=p==='pro'?'Pro plan':'Free plan'; vSettings(); toast(p==='pro'?'Welcome to Pro':'Switched to Free'); }
function exportData(){
  const data={app:'CoopKey',appVersion:VERSION,schema:1,version:1,exported:Date.now(),user:{name:ME.name,email:ME.email},
    birds:Store.all('birds'),batches:Store.all('batches'),eggs:Store.all('eggs'),
    breeds:Store.all('breeds').filter(b=>!b.system),candlingRecords:Store.all('candlingRecords'),
    journal:Store.all('journal'),clients:Store.all('clients'),invoices:Store.all('invoices'),expenses:Store.all('expenses'),shipments:Store.all('shipments'),biz:Store.all('biz')};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`coopkey-${new Date().toISOString().slice(0,10)}.json`; a.click();
  toast('Export downloaded');
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(d.app!=='CoopKey') throw 0;
    ['birds','batches','eggs','candlingRecords','journal','clients','invoices','expenses','shipments','biz'].forEach(c=>{ if(d[c]) Store.save(c, d[c]); });
    if(d.breeds){ const sys=Store.all('breeds').filter(b=>b.system); Store.save('breeds',[...sys,...d.breeds]); }
    toast('Data imported'); go('dashboard');
  }catch(e){ toast('That file is not a CoopKey export'); } };
  r.readAsText(f);
}
function signOut(){ Auth.signout(); Cloud.signout(); location.reload(); }

/* ---------- MODAL ---------- */
function modal(bodyHtml,confirmLabel,onConfirm,cancelLabel='Cancel'){
  modalRaw(bodyHtml,
    `<button class="btn btn-ghost" onclick="closeModal()">${cancelLabel}</button>
     <button class="btn btn-primary" id="mConfirm">${confirmLabel}</button>`);
  document.getElementById('mConfirm').onclick=()=>{ if(onConfirm()!==false) closeModal(); };
}
function modalRaw(bodyHtml,footerHtml){
  document.getElementById('modal').innerHTML=bodyHtml+`<div class="modal-actions">${footerHtml}</div>`;
  document.getElementById('modalBg').classList.add('on');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('on'); const m=document.getElementById('modal'); if(m) m.classList.remove('wide'); }
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

/* ---------- START ---------- */
(async function init(){
  try{ applyTheme(localStorage.getItem('ck.theme')||'candle'); }catch(e){}
  document.querySelectorAll('.ver').forEach(e=>e.textContent='v'+VERSION);
  // reflect mode in the auth footer
  const foot=document.querySelector('.auth-foot');
  if(foot) foot.innerHTML = Cloud.on()
    ? 'Cloud sync is on — your flock follows you across devices.'
    : 'Demo build — accounts are stored locally on this device.<br>Turn on cross-device sync in Settings.';
  if(Cloud.on()){
    if(Cloud.token()){
      try{ const {user}=await Cloud.req('/me'); ME=user; await boot(); return; }
      catch(e){ Cloud.signout(); } // expired/invalid token -> show login
    }
    return; // cloud mode, not signed in -> auth screen
  }
  const cur=Auth.current();
  if(cur){ ME=cur; await boot(); }
})();
</script>
</body>
</html>
